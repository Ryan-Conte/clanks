id: notion
name: Notion
summary: Search, read and write the pages and databases you share with your Notion integration.
hosts: [api.notion.com]
auth:
  type: api_key
  header: Authorization
  format: 'Bearer {secret}'
  label: Integration secret
  hint: notion.so/profile/integrations, a new internal integration. Then share each page or database with it from that page's menu, under Connections; it sees nothing else.
headers:
  # Pinned, so a later version of Notion's API can't change what these calls mean.
  Notion-Version: '2022-06-28'
openapi: openapi.yaml
check: get_me
account: bot.workspace_name
operations:
  - { id: get_me, op: 'GET /v1/users/me', risk: read }
  - { id: search, op: 'POST /v1/search', risk: read }
  - { id: get_page, op: 'GET /v1/pages/{page_id}', risk: read }
  - { id: get_blocks, op: 'GET /v1/blocks/{block_id}/children', risk: read }
  - { id: get_database, op: 'GET /v1/databases/{database_id}', risk: read }
  - { id: query_database, op: 'POST /v1/databases/{database_id}/query', risk: read }
  - { id: create_page, op: 'POST /v1/pages', risk: write }
  - { id: update_page, op: 'PATCH /v1/pages/{page_id}', risk: write }
  - { id: append_blocks, op: 'PATCH /v1/blocks/{block_id}/children', risk: write }
guide: guide.md
