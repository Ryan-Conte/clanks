packages:
  - apps/*
  - packages/*

# pnpm 10 runs no dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - esbuild
# better-sqlite3 ships N-API prebuilds for every platform, so there's nothing to compile.
# electron-winstaller is only for Squirrel.Windows; we package with NSIS.
ignoredBuiltDependencies:
  - better-sqlite3
  - electron-winstaller
